name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # CMakeLists.txt fetches SDL2, SDL_mixer, Dear ImGui, and Lua from
      # source via FetchContent -- caching build/_deps skips re-downloading
      # and re-building all four on every run. Keyed on CMakeLists.txt's own
      # hash so a pinned-version bump naturally invalidates the cache.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: windows-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022"

      - name: Build
        run: cmake --build build --config Debug --parallel

      # Same check used throughout local development: launch the real exe
      # and confirm it's still running a few seconds later, rather than
      # having exited immediately (crash, missing asset, bad init).
      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "build\Debug\singularity-engine.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            Write-Error "Engine exited immediately with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "Engine launched and ran for 5s without crashing."

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SDL2 is configured with X11/Wayland/Vulkan all off (see
      # CMakeLists.txt), so it only needs an audio backend's dev headers to
      # build its native (non-dummy) driver, not a full windowing stack.
      - name: Install SDL2 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libpulse-dev ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: linux-deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build --parallel

      # No display on this runner, so SDL runs its dummy video/audio drivers
      # -- still exercises the full Init()/asset-load path, just with no
      # actual window shown.
      - name: Smoke test
        run: |
          export SDL_VIDEODRIVER=dummy
          export SDL_AUDIODRIVER=dummy
          ./build/singularity-engine &
          PID=$!
          sleep 3
          if ! kill -0 $PID 2>/dev/null; then
            echo "Engine exited before the timeout"
            exit 1
          fi
          kill $PID
          echo "Engine launched and ran for 3s without crashing."
